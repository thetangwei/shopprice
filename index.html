<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <meta name="description" content="店价宝 ShopPrice — 小店商品价格管理工具。商品扫码查，价格随时记。">
    <meta name="theme-color" content="#0f766e">
    <title>店价宝 ShopPrice</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M18 22h28l-3 24H21l-3-24Z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M25 22a7 7 0 0 1 14 0' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="i-logo" viewBox="0 0 24 24">
            <path d="M4 8h16l-1.4 11.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8L4 8Z" />
            <path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" />
            <path d="M9 12.5h6" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
            <path d="m3 10 9-7 9 7" />
            <path d="M5 9.5V20h14V9.5" />
            <path d="M9.5 20v-5.5h5V20" />
        </symbol>
        <symbol id="i-box" viewBox="0 0 24 24">
            <path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7Z" />
            <path d="m3 8.5 9 5.5 9-5.5" />
            <path d="M12 14v7" />
        </symbol>
        <symbol id="i-database" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5.5" rx="8" ry="3" />
            <path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
            <path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
        </symbol>
        <symbol id="i-scan" viewBox="0 0 24 24">
            <path d="M4 8V5a1 1 0 0 1 1-1h3" />
            <path d="M16 4h3a1 1 0 0 1 1 1v3" />
            <path d="M20 16v3a1 1 0 0 1-1 1h-3" />
            <path d="M8 20H5a1 1 0 0 1-1-1v-3" />
            <path d="M4 12h16" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="M4 20h4l10.5-10.5a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20Z" />
            <path d="m13.5 7.5 3 3" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M4 7h16" />
            <path d="M9 7V4.5h6V7" />
            <path d="m6 7 1 13h10l1-13" />
            <path d="M10 11v5M14 11v5" />
        </symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24">
            <path d="m14 6-6 6 6 6" />
        </symbol>
        <symbol id="i-camera" viewBox="0 0 24 24">
            <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" />
            <circle cx="12" cy="13" r="3.5" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
            <path d="M12 4v11" />
            <path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
            <path d="M5 19h14" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
            <path d="M12 20V9" />
            <path d="m7.5 13.5 4.5-4.5 4.5 4.5" />
            <path d="M5 5h14" />
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 3 4.5 6v5.5c0 4.4 3.1 7.7 7.5 9.5 4.4-1.8 7.5-5.1 7.5-9.5V6L12 3Z" />
            <path d="m8.5 12 2.4 2.4 4.6-4.8" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5M12 8h.01" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
            <path d="m5 12.5 4.5 4.5L19 7" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-warning" viewBox="0 0 24 24">
            <path d="M12 4 2.8 20h18.4L12 4Z" />
            <path d="M12 9.5v4.5M12 17h.01" />
        </symbol>
        <symbol id="i-history" viewBox="0 0 24 24">

            <path d="M6 3h8l4 4v14H6V3Z" />
            <path d="M14 3v4h4" />
            <path d="M9 12h6M9 16h6" />

        <symbol id="i-refresh" viewBox="0 0 24 24">
            <path d="M20 11a8 8 0 1 0-.8 4" />
            <path d="M20 4v7h-7" />
        </symbol>
        <symbol id="i-tag" viewBox="0 0 24 24">
            <path d="M3 12V4h8l10 10-7 7L3 12Z" />
            <circle cx="7.5" cy="7.5" r="1.2" />
        </symbol>
    </svg>

    <div class="app-shell">
        <header class="app-header">
            <div class="header-inner">
                <a class="brand" href="#/home" aria-label="店价宝首页">
                    <span class="brand-logo">
                        <svg class="icon icon-lg" aria-hidden="true"><use href="#i-logo"></use></svg>
                    </span>
                    <span class="brand-copy">
                        <span class="brand-name">店价宝 <span>ShopPrice</span></span>
                        <span class="brand-tagline">小店商品价格管理工具</span>
                    </span>
                </a>
                <div class="header-actions">
                    <button type="button" class="header-scan" data-action="scan" aria-label="扫码查价">
                        <svg class="icon" aria-hidden="true"><use href="#i-scan"></use></svg>
                        <span class="label">扫码</span>
                    </button>
                </div>
            </div>
        </header>

        <main id="app" class="app-main" tabindex="-1">
            <noscript>
                <div class="notice notice-warning">店价宝需要启用 JavaScript 才能使用。</div>
            </noscript>
        </main>

        <nav class="bottom-nav" aria-label="主导航">
            <a class="nav-item" data-nav="home" href="#/home">
                <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
                <span>首页</span>
            </a>
            <a class="nav-item" data-nav="products" href="#/products">
                <svg class="icon" aria-hidden="true"><use href="#i-box"></use></svg>
                <span>商品</span>
            </a>
            <a class="nav-item" data-nav="data" href="#/data">
                <svg class="icon" aria-hidden="true"><use href="#i-database"></use></svg>
                <span>数据管理</span>
            </a>
        </nav>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root" class="modal-root"></div>

    <script src="assets/vendor/html5-qrcode.min.js" defer></script>
    <script src="assets/js/core.js" defer></script>
    <script src="assets/js/views.js" defer></script>
    <script src="assets/js/data-csv.js" defer></script>
    <script src="assets/js/data-backup.js" defer></script>
    <script src="assets/js/scanner.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</body>

</html>
